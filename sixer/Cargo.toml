[package]
name = "sixer"
version = "0.5.0"
edition = "2024"
authors = ["Ben Falk <benjamin.falk@yahoo.com>"]
description = "Hexagonal proc-macro runtime design helper"
repository = "https://github.com/benfalk/sixer"
keywords = ["framework", "hexagonal"]
license = "MIT"
readme = "../README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "parsing", "visit-mut"] }

[dev-dependencies]
mockall = "0.15"
# `assert_eq!` on `syn::Path` in the unit tests. Not enabled on the
# normal dependency, so dependents do not compile those impls.
syn = { version = "3", features = ["extra-traits"] }
